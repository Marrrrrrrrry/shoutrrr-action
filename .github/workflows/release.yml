---
name: Release
on:
  workflow_run:
    workflows: ["Build and test"]
    branches: [main]
    types:
      - completed

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Compute next release tag
        id: version
        env:
          DEFAULT_BUMP: patch
        run: |
          set -euo pipefail

          # Latest stable semver tag in the repository, version-sorted - same
          # discovery rule github-tag-action uses (refs/tags only, v-prefixed).
          tag="$(git for-each-ref refs/tags --sort=-v:refname --format '%(refname:short)' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          [ -n "$tag" ] || tag="v0.0.0"

          # Skip when the newest tag already points at HEAD (no new commits),
          # mirroring upstream's "No new commits" short-circuit.
          if [ "$(git rev-list -n 1 "$tag" 2>/dev/null || true)" = "$(git rev-parse HEAD)" ]
          then
            echo "No new commits since $tag. Skipping tag creation."
            echo "new_tag=$tag" >> "$GITHUB_OUTPUT"
            echo "create=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Scan commit messages since the latest tag for explicit bump hints;
          # tokens and precedence match github-tag-action.
          log="$(git log "$tag"..HEAD --format=%B 2>/dev/null || true)"
          case "$log" in
            *"#major"*) part="major" ;;
            *"#minor"*) part="minor" ;;
            *"#patch"*) part="patch" ;;
            *"#none"*)
              echo "Bump suppressed by #none."
              echo "new_tag=$tag" >> "$GITHUB_OUTPUT"
              echo "create=false" >> "$GITHUB_OUTPUT"
              exit 0 ;;
            *)
              part="${DEFAULT_BUMP:-patch}" ;;
          esac
          if [ "$part" = "none" ]; then
            echo "new_tag=$tag" >> "$GITHUB_OUTPUT"
            echo "create=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Bump the requested semver component (10# guards against octal).
          IFS=. read -r ma mi pa <<< "${tag#v}"
          case "$part" in
            major) ma=$((10#$ma + 1)); mi=0; pa=0 ;;
            minor) mi=$((10#$mi + 1)); pa=0 ;;
            patch) pa=$((10#$pa + 1)) ;;
          esac
          new="v${ma}.${mi}.${pa}"
          echo "Bumping $tag -> $new ($part)"
          echo "new_tag=$new" >> "$GITHUB_OUTPUT"
          echo "create=true" >> "$GITHUB_OUTPUT"
      - name: Create release tag
        if: ${{ steps.version.outputs.create == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.new_tag }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          existing="$(gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" --jq .object.sha 2>/dev/null || true)"
          if [ "$existing" = "$sha" ]; then
            echo "Tag $TAG already points at $sha; nothing to do."
          elif [ -n "$existing" ]; then
            echo "::error::Tag $TAG already exists at $existing, refusing to move it." >&2
            exit 1
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$TAG" -f sha="$sha" > /dev/null
            echo "Created tag $TAG at $sha."
          fi
      - name: Compute major version tag
        id: major-version
        if: ${{ steps.version.outputs.new_tag }}
        run: echo "tag=${NEW_TAG%%.*}" >> "$GITHUB_OUTPUT"
        env:
          NEW_TAG: ${{ steps.version.outputs.new_tag }}
      - name: Move major version tag (${{ steps.major-version.outputs.tag }})
        if: ${{ steps.version.outputs.new_tag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.major-version.outputs.tag }}
        run: |
          sha="$(git rev-parse HEAD)"
          if gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" > /dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" -f sha="$sha" -F force=true
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$sha"
          fi
      - name: Get current date
        if: ${{ steps.version.outputs.new_tag }}
        id: date
        run: echo "date=$(date --iso-8601)" >> "$GITHUB_OUTPUT"
      - name: Get shoutrrr version
        if: ${{ steps.version.outputs.new_tag }}
        id: shoutrrr
        run: echo "version=$(docker build --iidfile ${{ runner.temp }}/iidfile - < Dockerfile 2> /dev/null && docker run --rm "$(cat ${{ runner.temp }}/iidfile)" --version)" >> "$GITHUB_OUTPUT"
      - name: Build full ChangeLog
        if: ${{ steps.version.outputs.new_tag }}
        run: npx conventional-changelog-cli@5.0.0 --release-count=0 --preset=eslint --outfile="${{ runner.temp }}/FullChangeLog.md"
      - name: Create/update release ${{ steps.major-version.outputs.tag }}
        if: ${{ steps.version.outputs.new_tag }}
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          tag: ${{ steps.major-version.outputs.tag }}
          name: ${{ steps.version.outputs.new_tag }} (${{ steps.date.outputs.date }} / ${{ steps.shoutrrr.outputs.version }})
          bodyFile: ${{ runner.temp }}/FullChangeLog.md
      - name: Build ChangeLog
        if: ${{ steps.version.outputs.new_tag }}
        run: npx conventional-changelog-cli@5.0.0 --release-count=2 --outfile="${{ runner.temp }}/ChangeLog.md"
      - name: Create release ${{ steps.version.outputs.new_tag }}
        if: ${{ steps.version.outputs.new_tag }}
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.version.outputs.new_tag }}
          name: ${{ steps.version.outputs.new_tag }} (${{ steps.shoutrrr.outputs.version }})
          bodyFile: ${{ runner.temp }}/ChangeLog.md
